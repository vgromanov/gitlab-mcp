include:
  - project: "skunk-works/tools/ci-pipelines"
    ref: master
    file: /pipelines/golang.yml

variables:
  SONAR_PROJECT_KEY: $CI_PROJECT_NAME
  # Vendored deps are audited via go.mod/Trivy; scanning vendor/ floods Semgrep HIGH noise.
  # See vault gotcha / RVG-79 (mattermost-mcp AppSec Semgrep vendor exclude).
  APPSEC_SEMGREP_EXCLUDE: vendor

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

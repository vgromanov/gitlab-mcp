name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go mod tidy (drift gate)
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/gitlab-mcp ./cmd/gitlab-mcp

      - name: Test
        if: runner.os != 'Linux'
        run: go test -race -count=1 ./...

      - name: Test with coverage gate
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          ./scripts/check-coverage.sh --profile coverage.out --threshold 80

      - name: Upload coverage profile
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-profile
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Write .env from secrets
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITLAB_PERSONAL_ACCESS_TOKEN }}
          GITLAB_API_URL: ${{ secrets.GITLAB_API_URL }}
        run: |
          test -n "$GITLAB_PERSONAL_ACCESS_TOKEN"
          {
            echo "GITLAB_PERSONAL_ACCESS_TOKEN=$GITLAB_PERSONAL_ACCESS_TOKEN"
            echo "GITLAB_API_URL=${GITLAB_API_URL:-https://gitlab.com/api/v4}"
          } > .env

      - name: Integration tests
        run: go test -tags=integration -timeout=10m ./...

  gitcache-native:
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build pinned Git 2.50.1 fixture
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: ./scripts/ci/build-git-cache-fixture.sh

      - name: Compile uninstrumented helper
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: CGO_ENABLED=0 go test -mod=vendor -c -o "$RUNNER_TEMP/gitcache-helper.test" ./internal/gitcache

      - name: Native enforcement tests
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITCACHE_GIT: ${{ runner.temp }}/git-src/git-2.50.1/git
          GITCACHE_IDENTITY: ${{ runner.temp }}/gitcache-identity
          GITCACHE_HELPER: ${{ runner.temp }}/gitcache-helper.test
        run: go test -mod=vendor -race -count=1 -tags=gitcache_ci -timeout=10m ./internal/gitcache

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go mod tidy (drift gate)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/gitlab-mcp ./cmd/gitlab-mcp

      - name: Test with coverage gate
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          ./scripts/check-coverage.sh --profile coverage.out --threshold 80

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-profile
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  gitcache-native:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Native gitcache tests
        run: go test -mod=vendor -race -count=1 -tags=gitcache_ci -timeout=10m ./internal/gitcache/...

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Write .env from secrets
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITLAB_PERSONAL_ACCESS_TOKEN }}
          GITLAB_API_URL: ${{ secrets.GITLAB_API_URL }}
        run: |
          test -n "$GITLAB_PERSONAL_ACCESS_TOKEN"
          {
            echo "GITLAB_PERSONAL_ACCESS_TOKEN=$GITLAB_PERSONAL_ACCESS_TOKEN"
            echo "GITLAB_API_URL=${GITLAB_API_URL:-https://gitlab.com/api/v4}"
          } > .env

      - name: Integration tests
        run: go test -tags=integration -timeout=10m ./...
